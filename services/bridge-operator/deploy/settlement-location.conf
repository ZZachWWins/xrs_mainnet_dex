# Include only in the mainnetrpc TLS server, before its fallback location.
# The backend enforces exact paths, body/field limits and allowed origins.
location ^~ /settlement/v1/ {
    if ($request_method !~ ^(GET|POST|OPTIONS)$) { return 405; }
    limit_conn xeris_settlement_all 4;
    limit_conn xeris_settlement_ip 2;
    limit_req zone=xeris_settlement_request_ip burst=4 nodelay;
    limit_req zone=xeris_settlement_request_all burst=8 nodelay;
    client_max_body_size 16k;
    access_log off;
    proxy_pass http://xeris_settlement;
    proxy_next_upstream off;
    proxy_connect_timeout 1s;
    proxy_read_timeout 30s;
    proxy_send_timeout 10s;
    proxy_cache off;
    proxy_store off;
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    # A location-level add_header suppresses the parent's wildcard CORS set.
    # Restore only the backend's exact-origin policy hidden by the parent.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_pass_header Access-Control-Allow-Origin;
    proxy_pass_header Access-Control-Allow-Methods;
    proxy_pass_header Access-Control-Allow-Headers;
    proxy_pass_header Access-Control-Max-Age;
    # Complete set: location proxy_set_header replaces parent inheritance.
    proxy_set_header Host mainnetrpc.xerisweb.com;
    proxy_set_header Connection close;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Xrs-Internal-Peer-Address "";
}
