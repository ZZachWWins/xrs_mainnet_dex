# Include once in Nginx http context. Independent of native RPC limits.
limit_conn_zone $server_name zone=xeris_settlement_all:64k;
limit_conn_zone $binary_remote_addr zone=xeris_settlement_ip:1m;
limit_req_zone $binary_remote_addr zone=xeris_settlement_request_ip:1m rate=2r/s;
limit_req_zone $server_name zone=xeris_settlement_request_all:64k rate=5r/s;
upstream xeris_settlement {
    zone xeris_settlement 64k;
    server 127.0.0.1:8791 max_conns=4 max_fails=0;
}
