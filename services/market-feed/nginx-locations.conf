    # BEGIN XERIS MARKET FEED LOCATIONS
    # Public cached data only. These budgets are independent of native RPC.
    location = /market/supply {
        if ($request_method = OPTIONS) { return 204; }
        if ($request_method != GET) { return 405; }
        limit_conn xeris_market_all 32;
        limit_conn xeris_market_ip 4;
        limit_req zone=xeris_market_request_ip burst=4 nodelay;
        limit_req zone=xeris_market_request_all burst=20 nodelay;
        proxy_pass http://xeris_market_feed;
    }

    location = /market/status {
        if ($request_method = OPTIONS) { return 204; }
        if ($request_method != GET) { return 405; }
        limit_conn xeris_market_all 32;
        limit_conn xeris_market_ip 4;
        limit_req zone=xeris_market_request_ip burst=4 nodelay;
        limit_req zone=xeris_market_request_all burst=20 nodelay;
        proxy_pass http://xeris_market_feed;
    }

    location = /market/stream {
        if ($request_method = OPTIONS) { return 204; }
        if ($request_method != GET) { return 405; }
        limit_conn xeris_market_all 32;
        limit_conn xeris_market_ip 4;
        limit_req zone=xeris_market_request_ip burst=4 nodelay;
        limit_req zone=xeris_market_request_all burst=20 nodelay;
        proxy_buffering off;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_pass http://xeris_market_feed;
        # Defining any proxy_set_header here disables header inheritance;
        # repeat the complete safe set and clear Connection for SSE.
        proxy_set_header Host mainnetrpc.xerisweb.com;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Xrs-Internal-Peer-Address "";
    }
    # END XERIS MARKET FEED LOCATIONS

